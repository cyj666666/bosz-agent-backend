spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.opengauss.Driver
    url: jdbc:opengauss://127.0.0.1:5432/bosz?currentSchema=as_agent&characterEncoding=UTF-8
    username: as_agent
    password: AsAgent@2024
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      # GaussDB PostgreSQL协议适配
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: true

logging:
  level:
    com.suzhou.bank: DEBUG

# ══════════════════════════════════════════════════════════════════════════
# 检查项解析（P4）：解析结果的来源模型
#
# parse-model-code 对应 large_model_config.lm_code（CallLlmUtil 按该字段索引配置）。
# 本库 large_model_config 当前只有一条 'bosz-report-ai'（model=deepseek-flash，
# url=https://api.deepseek.com/chat/completions），故解析复用同一模型；
# 若公司后续提供专用的「审查规则解析」模型，只改这一行即可，无需改代码。
#
# 说明：默认值（代码里的 @Value 兜底）是 h20-DeepSeek-V32，那是源工程的厂商模型编码，
# 本库并不存在——所以这里必须显式覆盖，否则运行时会报「未找到大模型配置」。
# ══════════════════════════════════════════════════════════════════════════
agent:
  rule:
    parse-model-code: bosz-report-ai

# ══════════════════════════════════════════════════════════════════════════
# 报告内容加工：本地走**真实智能体链路**（2026-09-17 联调开关）
#
# application.yml 里默认是 true（走 MockReportContentProvider，读
# classpath:report-demo/demo-content.json 的预置内容，只用于演示）；
# 这里覆盖成 false → 启用 AgentReportContentProvider，逐块真实调
# 「知识配置 / 智策引擎」。
#
# ⚠️ @ConditionalOnProperty 是**启动期**判定的 → 改完必须**重启后端**才生效。
# ⚠️ 本地自测若想退回演示模式，把这段注释掉即可（会回落 application.yml 的 true）。
# ══════════════════════════════════════════════════════════════════════════
report:
  mock-content:
    enabled: false
