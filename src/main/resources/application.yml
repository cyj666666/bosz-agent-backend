server:
  port: 8080

app:
  # 启动时是否自动执行 SQL 初始化（init_auth_gaussdb / init_db_gaussdb / init_sample_data）
  # 默认 false：应用启动不改库，DDL/DML 一律人工执行（含 init_db_comments.sql）
  # 仅在空库快速拉起时才临时置 true
  init-sql-on-startup: false

spring:
  profiles:
    active: dev
  application:
    name: bosz-agent-backend

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.suzhou.bank.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      # 修正（2026-09-14）：原为 mysql，与实际数据源 jdbc:opengauss:// 不一致。
      # 同类的功能性修复见 MyBatisPlusConfig（分页方言 MYSQL → POSTGRE_SQL）。
      db-type: postgre_sql
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

know-kit:
  base-url: http://localhost:9000
  analyze-path: /api/v1/analyze
  timeout: 300000

jwt:
  secret: bSzAgent2026SuzhouBankLoanManagementSecretKey
  expiration: 7200000

#报告详情是否使用模拟数据
report:
  mock-content:
    enabled: true
  # 报告实例加工（列表页「发起报告」/ 详情页「更新报告」后异步执行）
  # 外网没有行内的「生成池轮询」：发起落 111 后直接触发加工，111 → 000 → 888/999。
  # 加工要逐块取数、后续还要调大模型，是长耗时 IO，故与 Web 请求、AI 分析线程池都隔离。
  generate:
    # 核心线程数
    pool-size: 2
    # 最大线程数（队列满后才扩容）
    max-pool-size: 4
    # 队列容量；满了由提交线程兜底执行（CallerRuns），不丢任务
    queue-capacity: 50
  # AI 全文分析（前端手动触发，后台独立线程池执行，前端按状态轮询）
  ai-analysis:
    # 使用 large_model_config 里哪一行配置（按 lm_code 匹配）
    # 本工程自定义该表字段语义（api_key 明文、url 完整地址），故用专属编码，不与其它工程的行混用
    lm-code: bosz-report-ai
    # 调用大模型的超时（毫秒）：后台非流式一次性调用，10 分钟足够且不长时间占线程
    timeout-millis: 600000
    # 送进模型的素材字符上限，超出截断
    max-material-chars: 60000
    # 独立线程池（全文分析是长耗时 IO，与报告生成/Web 请求隔离）
    pool-size: 2
    max-pool-size: 4
    queue-capacity: 50

# ============================================================================
# agent 模块（指标配置 / 知识配置管理 / 智策引擎）
# ----------------------------------------------------------------------------
# 来源：安硕 amar-agent-server 的三个业务模块。配置项统一收敛到 agent.* 命名空间，
# 与宿主既有配置（report.* / know-kit.* 等）完全分开，便于整体搬迁或摘除。
# ============================================================================
agent:
  # 检查项解析使用的大模型 lm_code（对应 large_model_config.lm_code）。
  # 刻意不复用 report.ai-analysis.lm-code：两者用途不同，共用会导致调一处影响另一处。
  # 仅 P4「智策引擎」使用，P2 指标配置不涉及。
  lm-code: agent-rule-parse
  # 检查项解析的提示词资源路径（classpath: 或 file: 前缀）
  rule-parse-prompt: classpath:prompts/rule-parse-prompt.txt
  # 指标清单粗筛上限：把全部指标塞进提示词会超 token 且稀释模型注意力，
  # 先本地按关键词粗筛出候选短名单；设为 0 表示不粗筛、全量喂给模型。
  indicator-catalog-limit: 200
  # 大模型调用超时（毫秒）
  timeout-millis: 60000

  index:
    # 是否启用「角色 → 指标」权限过滤（对应 AgentProperties#indexRoleFilterEnabled）
    # true  = 按 sys_role_index 过滤当前用户可访问的指标/分组；
    # false = 所有登录用户可见全部指标分组与指标（调试用，等价于关掉这套授权）。
    role-filter-enabled: true
    # 不受上面过滤约束的角色编码（超管放行，能看到全部指标）。
    # 用「角色编码」而不是角色主键：编码可读、跨环境稳定；主键是各环境自增数字，写进配置会绑死环境。
    # 注意这与 sys_role_index.role_id 存「角色主键」是两回事——前者用于绕过，后者用于授权数据关联。
    role-filter-bypass-roles:
      - admin

  # 进程内缓存（源工程为 cache.memory.*，此处收敛到 agent 命名空间）
  # 注意：这三个键是 @Value 直读，必须与 AgentDataCacheConfig 里的键名逐字一致
  cache:
    memory:
      initial-capacity: 500
      max-size: 1000
      expire-time: 600

  # 动态取数引擎（DynamicDBUtil）连接外部业务库时新建的 Druid 连接池参数
  # 源工程为 spring.datasource.dynamic.*；此处改名，避免与宿主主库的 spring.datasource 混淆。
  # 不配置则使用代码内置默认值（initial-size=5 / min-idle=10 / max-active=50 等）。
  dynamic:
    datasource:
      druid:
        initial-size: 5
        min-idle: 10
        max-active: 50
        max-wait: 10000
        # JDBC 层超时，避免外部库不可达时 TCP 连接长时间挂住线程
        connect-timeout: 5000
        socket-timeout: 15000
        connection-error-retry-attempts: 1
        time-between-connect-error-millis: 5000

